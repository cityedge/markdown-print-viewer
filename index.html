<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Print Viewer</title>
  <meta name="application-name" content="Markdown Print Viewer v1.3.0">
  <meta name="color-scheme" content="dark light">

  <!--
    Markdown Print Viewer v1.3.0 standard edition
    Rendering engine: markdown-it + task-lists + footnote
    Sanitizer: DOMPurify
    Word export: docx.js
    The offline builder replaces the marker below with vendored library code.
  -->
    <!-- Runtime dependencies (pinned versions). The standard edition requires network access when these files are not already cached. -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@15.0.1/dist/browser/markdown-it.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@4.0.0/dist/markdown-it-footnote.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.14/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>

  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a20;
      --panel-2: #1d2129;
      --border: #2b313b;
      --text: #e8eaed;
      --muted: #9aa3af;
      --accent: #ff9f43;
      --accent-soft: rgba(255, 159, 67, .14);
      --paper: #ffffff;
      --paper-text: #24292f;
      --paper-muted: #57606a;
      --paper-border: #d0d7de;
      --paper-code: #f6f8fa;
      --paper-quote: #656d76;
      --page-width: 210mm;
      --shadow: 0 18px 55px rgba(0,0,0,.38);
      --ui-font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      --doc-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      --doc-size: 10.5pt;
      --doc-weight: 400;
      --mono-font: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }

    html[data-theme="light"] {
      --bg: #eef1f5;
      --panel: #ffffff;
      --panel-2: #f6f8fa;
      --border: #d0d7de;
      --text: #24292f;
      --muted: #66707b;
      --shadow: 0 16px 42px rgba(31,35,40,.15);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui-font);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 10px 16px;
      background: color-mix(in srgb, var(--panel) 93%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
      min-width: 0;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    .brand:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 72%, transparent);
      outline-offset: 4px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #141414;
      background: var(--accent);
      font-weight: 800;
      letter-spacing: -.04em;
      user-select: none;
    }

    .brand-copy { min-width: 0; }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
    }
    .file-name {
      margin-top: 3px;
      max-width: 44vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 11px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font: 600 13px/1 var(--ui-font);
      padding: 10px 13px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .05s ease;
    }
    button:hover { border-color: #56606d; }
    button:active { transform: translateY(1px); }
    button.primary {
      border-color: color-mix(in srgb, var(--accent) 65%, var(--border));
      background: var(--accent-soft);
      color: var(--accent);
    }
    button:disabled {
      opacity: .42;
      cursor: default;
      transform: none;
    }

    .type-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 2px;
    }
    .type-control {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .type-control label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      user-select: none;
    }
    .type-control select {
      appearance: none;
      min-height: 34px;
      padding: 7px 25px 7px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--panel-2);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 11px) 14px,
        calc(100% - 7px) 14px;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
      color: var(--text);
      font: 600 11px/1 var(--ui-font);
      cursor: pointer;
    }
    .type-control select:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 72%, transparent);
      outline-offset: 1px;
    }
    #fontSelect { width: 122px; }
    #sizeSelect { width: 72px; }
    #weightSelect { width: 94px; }

    .compat-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 34px;
      padding: 0 7px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
    }
    .compat-toggle input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .compat-toggle:has(input:checked) {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      color: var(--text);
    }

    .statusbar {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 34px;
      padding: 6px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #69717d;
      flex: 0 0 auto;
    }
    .status-dot.ok { background: #4caf73; }
    .status-dot.error { background: #e35d6a; }
    .status-spacer { margin-left: auto; }
    .compat { white-space: nowrap; }

    /* Reading mode: keep only the brand row visible to maximize document space. */
    .app.controls-collapsed .toolbar > :not(.brand) {
      display: none !important;
    }
    .app.controls-collapsed .toolbar {
      flex-wrap: nowrap;
    }
    .app.controls-collapsed .brand {
      width: 100%;
      margin-right: 0;
    }
    .app.controls-collapsed .statusbar {
      display: none !important;
    }

    .workspace {
      position: relative;
      padding: 28px 18px 60px;
      overflow: auto;
    }

    .paper {
      width: min(var(--page-width), calc(100vw - 36px));
      min-height: 297mm;
      margin: 0 auto;
      padding: 20mm 20mm 24mm;
      background: var(--paper);
      color: var(--paper-text);
      box-shadow: var(--shadow);
      border-radius: 2px;
    }

    .empty-state {
      min-height: 245mm;
      display: grid;
      place-items: center;
      text-align: center;
      color: #8c959f;
    }
    .empty-state[hidden] { display: none !important; }
    .empty-inner { max-width: 520px; }
    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 2px dashed #c7cdd3;
      border-radius: 16px;
      font: 700 23px/1 var(--mono-font);
      color: #68717b;
    }
    .empty-state h1 {
      margin: 0 0 10px;
      border: 0;
      font: 700 21px/1.35 var(--doc-font);
      color: #49515a;
    }
    .empty-state p {
      margin: 0;
      font: 14px/1.8 var(--doc-font);
    }

    .drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      background: rgba(10,12,16,.82);
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    .drop-overlay.active { display: grid; }
    .drop-card {
      min-width: min(520px, 80vw);
      padding: 40px;
      border: 2px dashed var(--accent);
      border-radius: 18px;
      color: var(--text);
      text-align: center;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .drop-card strong { color: var(--accent); }

    #fileInput, #folderInput { display: none; }

    /* Markdown document styling — intentionally GitHub-like, optimized for print. */
    .markdown-body {
      font-family: var(--doc-font);
      font-size: var(--doc-size);
      font-weight: var(--doc-weight);
      line-height: 1.48;
      overflow-wrap: break-word;
      word-break: normal;
      line-break: strict;
      text-rendering: optimizeLegibility;
    }

    .markdown-body > :first-child { margin-top: 0 !important; }
    .markdown-body > :last-child { margin-bottom: 0 !important; }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin-top: 1.25em;
      margin-bottom: .45em;
      font-weight: 700;
      line-height: 1.28;
      break-after: avoid-page;
      page-break-after: avoid;
    }
    .markdown-body h1 {
      padding-bottom: .28em;
      border-bottom: 1px solid var(--paper-border);
      font-size: 2em;
    }
    .markdown-body h2 {
      padding-bottom: .25em;
      border-bottom: 1px solid var(--paper-border);
      font-size: 1.5em;
    }
    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body h4 { font-size: 1em; }
    .markdown-body h5 { font-size: .875em; }
    .markdown-body h6 { font-size: .85em; color: var(--paper-muted); }

    .markdown-body p,
    .markdown-body blockquote,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body dl,
    .markdown-body table,
    .markdown-body pre,
    .markdown-body details {
      margin-top: 0;
      margin-bottom: .65em;
    }

    .markdown-body ul,
    .markdown-body ol { padding-left: 2em; }
    .markdown-body li + li { margin-top: .12em; }
    .markdown-body li > p { margin-top: .45em; }
    .markdown-body ul ul,
    .markdown-body ul ol,
    .markdown-body ol ol,
    .markdown-body ol ul { margin-top: 0; margin-bottom: 0; }

    .markdown-body blockquote {
      padding: .15em 1em;
      color: var(--paper-quote);
      border-left: .25em solid #d0d7de;
    }
    .markdown-body blockquote > :first-child { margin-top: 0; }
    .markdown-body blockquote > :last-child { margin-bottom: 0; }

    .markdown-body code,
    .markdown-body tt {
      margin: 0;
      padding: .18em .36em;
      border-radius: 4px;
      background: rgba(175,184,193,.2);
      font-family: var(--mono-font);
      font-size: 85%;
    }

    .markdown-body pre {
      overflow: auto;
      padding: 15px 16px;
      border-radius: 7px;
      background: var(--paper-code);
      font-size: 85%;
      line-height: 1.45;
      white-space: pre-wrap;
      break-inside: auto;
    }
    .markdown-body pre code {
      display: inline;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 100%;
      white-space: inherit;
    }

    .markdown-body a {
      color: #0969da;
      text-decoration: none;
    }
    .markdown-body a:hover { text-decoration: underline; }

    .markdown-body img {
      max-width: 100%;
      height: auto;
      box-sizing: content-box;
      background: #fff;
      break-inside: avoid;
      page-break-inside: avoid;
    }


    .markdown-body img.local-image-missing {
      min-width: 120px;
      min-height: 42px;
      outline: 1px dashed #d0d7de;
      outline-offset: 3px;
    }

    .markdown-body hr {
      height: .25em;
      margin: 1.1em 0;
      padding: 0;
      border: 0;
      background: #d8dee4;
    }

    .markdown-body table {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      border-spacing: 0;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    .markdown-body tr { background: #fff; border-top: 1px solid #d8dee4; }
    .markdown-body tr:nth-child(2n) { background: #f6f8fa; }
    .markdown-body th,
    .markdown-body td {
      padding: 6px 13px;
      border: 1px solid var(--paper-border);
      vertical-align: top;
    }
    .markdown-body th { font-weight: 700; }

    .markdown-body input[type="checkbox"] {
      margin: 0 .5em 0 -.2em;
      vertical-align: middle;
      accent-color: #0969da;
    }
    .markdown-body .contains-task-list { list-style: none; padding-left: 1.45em; }
    .markdown-body .task-list-item { list-style: none; }

    .markdown-body kbd {
      display: inline-block;
      padding: 2px 5px;
      border: 1px solid #afb8c1;
      border-bottom-width: 2px;
      border-radius: 5px;
      background: #f6f8fa;
      box-shadow: inset 0 -1px 0 #afb8c1;
      font: 11px var(--mono-font);
      line-height: 10px;
      color: #24292f;
      vertical-align: middle;
    }

    .markdown-body details {
      padding: .6em .8em;
      border: 1px solid var(--paper-border);
      border-radius: 6px;
      break-inside: avoid-page;
    }
    .markdown-body summary { cursor: pointer; font-weight: 600; }

    .markdown-body .footnotes-sep { margin-top: 2.2em; }
    .markdown-body .footnotes {
      color: var(--paper-muted);
      font-size: .88em;
    }
    .markdown-body .footnote-backref { margin-left: .25em; }

    .markdown-body .table-wrap {
      max-width: 100%;
      overflow-x: auto;
    }

    .load-error {
      padding: 16px;
      border: 1px solid #ffb3bb;
      border-radius: 8px;
      background: #fff3f4;
      color: #9f1c2c;
      font: 14px/1.65 var(--doc-font);
    }

    @media (max-width: 780px) {
      .toolbar { flex-wrap: wrap; }
      .brand { width: 100%; }
      .type-controls { order: 5; width: 100%; flex-wrap: wrap; }
      .file-name { max-width: 72vw; }
      .workspace { padding: 12px 8px 30px; }
      .paper {
        width: 100%;
        min-height: 0;
        padding: 24px 18px 36px;
      }
      .statusbar { overflow-x: auto; }
    }

    @page {
      size: A4 portrait;
      margin: 18mm 18mm 20mm;
    }

    @media print {
      html, body {
        width: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        color: #000 !important;
      }

      .toolbar,
      .statusbar,
      .drop-overlay {
        display: none !important;
      }

      .app,
      .workspace {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        background: #fff !important;
      }

      .paper {
        width: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: #fff !important;
        color: #000 !important;
      }

      .empty-state { display: none !important; }
      .markdown-body { font-size: var(--doc-size); line-height: 1.45; }

      .markdown-body a {
        color: inherit !important;
        text-decoration: underline;
        text-decoration-thickness: .05em;
        text-underline-offset: .12em;
      }

      .markdown-body pre,
      .markdown-body blockquote,
      .markdown-body table,
      .markdown-body img,
      .markdown-body details {
        break-inside: avoid-page;
        page-break-inside: avoid;
      }

      .markdown-body table {
        display: table;
        width: 100%;
        max-width: 100%;
        overflow: visible;
        font-size: .905em;
      }

      .markdown-body thead { display: table-header-group; }
      .markdown-body tr { break-inside: avoid; page-break-inside: avoid; }

      .markdown-body pre {
        white-space: pre-wrap !important;
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar" aria-label="Toolbar">
      <div class="brand" id="brandToggle" role="button" tabindex="0" aria-expanded="true">
        <div class="brand-mark">M↓</div>
        <div class="brand-copy">
          <div class="brand-title">Markdown Print Viewer</div>
          <div class="file-name" id="fileName">ファイル未選択 / No file selected</div>
        </div>
      </div>
      <button id="openBtn" class="primary" type="button">Markdownを開く</button>
      <button id="folderBtn" type="button">フォルダを開く</button>
      <div class="type-controls" aria-label="Typography settings">
        <div class="type-control">
          <label id="fontLabel" for="fontSelect">Font</label>
          <select id="fontSelect" title="本文フォント / Document font">
            <option value="standard">Standard</option>
            <option value="meiryo">Meiryo</option>
            <option value="yugothic">Yu Gothic</option>
            <option value="bizudpgothic">BIZ UDPGothic</option>
            <option value="yumincho">Yu Mincho</option>
            <option value="bizudpmincho">BIZ UDPMincho</option>
          </select>
        </div>
        <div class="type-control">
          <label id="sizeLabel" for="sizeSelect">Size</label>
          <select id="sizeSelect" title="本文サイズ / Document size">
            <option value="9">9 pt</option>
            <option value="9.5">9.5 pt</option>
            <option value="10">10 pt</option>
            <option value="10.5">10.5 pt</option>
            <option value="11">11 pt</option>
            <option value="12">12 pt</option>
          </select>
        </div>
        <div class="type-control">
          <label id="weightLabel" for="weightSelect">Weight</label>
          <select id="weightSelect" title="本文の太さ / Document weight">
            <option value="400">Regular</option>
            <option value="500">Medium</option>
            <option value="600">Semi-bold</option>
          </select>
        </div>
      </div>
      <label class="compat-toggle" id="japaneseCompatToggle" title="日本語Markdown向けの互換補正を適用">
        <input id="japaneseCompat" type="checkbox">
        <span id="japaneseCompatLabel">日本語互換性</span>
      </label>
      <button id="wordBtn" type="button" disabled>Word出力</button>
      <button id="printBtn" type="button" disabled>印刷</button>
      <button id="themeBtn" type="button" title="表示テーマを切り替え">☼</button>
      <button id="langBtn" type="button" title="Switch language">EN</button>
      <input id="fileInput" type="file" accept=".md,.markdown,.mdown,.mkd,text/markdown,text/plain">
      <input id="folderInput" type="file" webkitdirectory directory multiple>
    </header>

    <div class="statusbar">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">Markdownファイルを開くか、この画面にドロップしてください。</span>
      <span class="status-spacer"></span>
      <span class="compat" id="folderStatus">Folder: —</span>
      <span class="compat">CommonMark / GFM + Task Lists + Footnotes</span>
    </div>

    <main class="workspace" id="workspace">
      <article class="paper" id="paper">
        <div class="empty-state" id="emptyState">
          <div class="empty-inner">
            <div class="empty-icon">.md</div>
            <h1>Markdownを文書として表示・印刷</h1>
            <p>Markdownファイルをドラッグ＆ドロップするか、上の「Markdownを開く」から選択してください。</p>
          </div>
        </div>
        <div class="markdown-body" id="rendered" hidden></div>
      </article>
    </main>
  </div>

  <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
    <div class="drop-card"><strong>.md</strong> ファイルをここにドロップ</div>
  </div>

  <script>
    (() => {
      'use strict';

      const i18n = {
        ja: {
          noFile: 'ファイル未選択 / No file selected',
          open: 'Markdownを開く',
          openFolder: 'フォルダを開く',
          print: '印刷',
          word: 'Word出力',
          wordTitle: '現在のMarkdownをWord (.docx) に変換',
          wordUnavailable: 'Word出力ライブラリを読み込めませんでした。通常版ではネット接続を、オフライン版ではビルド状態を確認してください。',
          wordExporting: 'Wordファイルを生成中…',
          wordExported: 'Word (.docx) を生成しました。',
          wordExportedImages: (ok, total) => `Word (.docx) を生成しました · 画像 ${ok}/${total} 埋め込み`,
          wordError: 'Wordファイルの生成に失敗しました。',
          idle: 'Markdownファイルを開くか、この画面にドロップしてください。',
          loaded: 'レンダリング完了',
          loadedImages: (ok, total) => `レンダリング完了 · ローカル画像 ${ok}/${total}`,
          loading: '読み込み中…',
          folderLoading: 'フォルダを読み込み中…',
          folderReady: name => `フォルダ「${name}」を読み込みました。`,

      const fontStacks = {

        yumincho: '"Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "BIZ UDPMincho", serif',
        bizudpmincho: '"BIZ UDPMincho", "BIZ UDMincho", "Yu Mincho", "YuMincho", serif'
      };

      const allowedWeights = new Set(['400', '500', '600']);

      function applyTypography(save = true) {

      function initTypography() {
        const fontKey = localStorage.getItem('mpv.font') || 'standard';
        const size = localStorage.getItem('mpv.size') || '10.5';
        const weight = localStorage.getItem('mpv.weight') || '400';

        els.weightSelect.value = allowedWeights.has(weight) ? weight : '400';

      }

      function initMarkdown() {
        if (typeof window.markdownit !== 'function' || typeof window.DOMPurify === 'undefined') {
          setStatus(t('libError'), 'error');
          els.openBtn.disabled = true;
          els.folderBtn.disabled = true;
          return false;
        }

        md = window.markdownit({
          html: true,
          xhtmlOut: false,
          breaks: false,
          langPrefix: 'language-',
          linkify: true,
          typographer: false,
          quotes: '“”‘’'
        });

        if (typeof window.markdownitTaskLists === 'function') {
          md.use(window.markdownitTaskLists, { enabled: true, label: true, labelAfter: true });
        }
        if (typeof window.markdownitFootnote === 'function') {
          md.use(window.markdownitFootnote);
        }

        const defaultLinkOpen = md.renderer.rules.link_open || ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options));
        md.renderer.rules.link_open = (tokens, idx, options, env, self) => {
          const hrefIndex = tokens[idx].attrIndex('href');
          if (hrefIndex >= 0) {
            const href = tokens[idx].attrs[hrefIndex][1] || '';
            if (!href.startsWith('#')) {
              tokens[idx].attrSet('target', '_blank');
              tokens[idx].attrSet('rel', 'noopener noreferrer');
            }
          }
          return defaultLinkOpen(tokens, idx, options, env, self);
        };

        return true;
      }

      function sanitize(html) {
        return window.DOMPurify.sanitize(html, {
          USE_PROFILES: { html: true },
          ADD_TAGS: ['details', 'summary', 'kbd'],
          ADD_ATTR: ['target', 'rel', 'open', 'checked', 'disabled', 'type', 'class', 'id', 'aria-label', 'src', 'alt', 'title']
        });
      }

      function revokeObjectUrls() {
        objectUrls.forEach(url => URL.revokeObjectURL(url));
        objectUrls = [];
      }

      function normalizePath(path) {
        const parts = String(path || '').replace(/\\/g, '/').split('/');
        const out = [];
        for (let part of parts) {
          if (!part || part === '.') continue;
          try { part = decodeURIComponent(part); } catch (_) {}
          if (part === '..') {
            if (!out.length) return null; // would escape the selected folder root
            out.pop();
          } else {
            out.push(part);
          }
        }
        return out.join('/');
      }

      function dirname(path) {
        const normalized = normalizePath(path || '');
        if (!normalized || !normalized.includes('/')) return '';
        return normalized.slice(0, normalized.lastIndexOf('/'));
      }

      function joinRelative(baseDir, ref) {
        const cleanRef = String(ref || '').split('#')[0].split('?')[0];
        if (!cleanRef) return null;
        return normalizePath(baseDir ? `${baseDir}/${cleanRef}` : cleanRef);
      }

      function isLocalRelativeUrl(src) {
        const value = String(src || '').trim();
        if (!value || value.startsWith('#') || value.startsWith('//')) return false;
        if (/^(?:[a-z][a-z0-9+.-]*:)/i.test(value)) return false; // http:, https:, data:, blob:, file:, etc.
        if (/^[a-zA-Z]:[\\/]/.test(value)) return false; // Windows absolute path
        if (value.startsWith('/') || value.startsWith('\\')) return false;
        return true;
      }

      async function resolveLocalImages() {
        revokeObjectUrls();
        if (!folderFiles.size) return { total: 0, resolved: 0 };

        const baseDir = dirname(currentMarkdownPath || '');
        const images = [...els.rendered.querySelectorAll('img[src]')].filter(img => isLocalRelativeUrl(img.getAttribute('src')));
        let resolved = 0;

        for (const img of images) {
          const original = img.getAttribute('src') || '';
          const targetPath = joinRelative(baseDir, original);
          const file = targetPath ? folderFiles.get(targetPath) : null;
          img.dataset.originalSrc = original;
          if (file) {
            const url = URL.createObjectURL(file);
            objectUrls.push(url);
            img.src = url;
            img.classList.remove('local-image-missing');
            resolved += 1;
          } else {
            img.classList.add('local-image-missing');
            img.title = img.title || `Local image not found: ${original}`;
          }
        }

        return { total: images.length, resolved };
      }

      // Japanese compatibility is intentionally a separate, opt-in compatibility layer.
      // Source fixes run before markdown-it so delimiter pairing remains structurally correct.
      // DOM fixes (none at present) run after rendering. Add future Japanese/CJK-specific fixes
      // to one of these lists rather than changing the core Markdown parser.
      const japaneseCompatibilitySourceFixes = [
        fixJapaneseStrongAfterClosingPunctuationInSource
      ];
      const japaneseCompatibilityDomFixes = [];

      function prepareJapaneseCompatibleSource(source) {
        if (!els.japaneseCompat.checked) return source;
        let output = source;
        for (const fix of japaneseCompatibilitySourceFixes) output = fix(output);
        return output;
      }

      function applyJapaneseCompatibility(root) {
        if (!els.japaneseCompat.checked) return;
        for (const fix of japaneseCompatibilityDomFixes) fix(root);
      }

      // CommonMark emphasis delimiter rules can refuse to close **...** / __...__ when
      // the emphasized text ends in closing punctuation and Japanese text continues immediately.
      // Example: **因果的な根拠づけ（grounding）**です。
      //
      // A previous DOM repair could mis-pair adjacent spans such as:
      // **特権（privilege）**と**権威（authority）**
      // and accidentally bold only the conjunction. Instead, this source-layer fix inserts an
      // invisible HTML comment immediately after the *intended closing delimiter*. The following
      // '<' is punctuation for CommonMark's delimiter test, allowing markdown-it to pair the
      // original delimiters correctly. DOMPurify removes the comment from the rendered document.
      // Fenced code and inline code spans are deliberately excluded. The original Markdown string
      // stored by the viewer is never modified.
      function fixJapaneseStrongAfterClosingPunctuationInSource(source) {
        const closingPunctuation = '）］｝〉》」』】〕〗〙〛〞〟’”！？：；、。';
        const starPattern = new RegExp(`(?<!\\\\)\\*\\*((?:(?!\\*\\*)[^\\r\\n])+?[${closingPunctuation}])\\*\\*(?=[\\p{L}\\p{N}])`, 'gu');
        const underscorePattern = new RegExp(`(?<!\\\\)__((?:(?!__)[^\\r\\n])+?[${closingPunctuation}])__(?=[\\p{L}\\p{N}])`, 'gu');

        return transformMarkdownTextOutsideCode(source, text =>
          text
            .replace(starPattern, (_match, content) => `**${content}**<!--mpv-jpcompat-->`)
            .replace(underscorePattern, (_match, content) => `__${content}__<!--mpv-jpcompat-->`)
        );
      }

      function transformMarkdownTextOutsideCode(source, transformText) {
        const parts = String(source || '').split(/(\r\n|\n|\r)/);
        let fenceChar = '';
        let fenceLength = 0;

        for (let index = 0; index < parts.length; index += 2) {
          const line = parts[index];

          if (fenceChar) {
            const close = line.match(/^ {0,3}(`{3,}|~{3,})[ \t]*$/);
            if (close && close[1][0] === fenceChar && close[1].length >= fenceLength) {
              fenceChar = '';
              fenceLength = 0;
            }
            continue;
          }

          const open = line.match(/^ {0,3}(`{3,}|~{3,})/);
          if (open) {
            fenceChar = open[1][0];
            fenceLength = open[1].length;
            continue;
          }

          parts[index] = transformOutsideInlineCode(line, transformText);
        }

        return parts.join('');
      }

      function transformOutsideInlineCode(line, transformText) {
        let output = '';
        let textStart = 0;
        let cursor = 0;

        while (cursor < line.length) {
          if (line[cursor] !== '`' || isEscapedAt(line, cursor)) {
            cursor += 1;
            continue;
          }

          const openerStart = cursor;
          while (cursor < line.length && line[cursor] === '`') cursor += 1;
          const runLength = cursor - openerStart;
          const closerStart = findMatchingBacktickRun(line, cursor, runLength);

          if (closerStart < 0) {
            // Be conservative around unmatched backticks: transform text before them, but leave
            // the remainder untouched rather than risking a compatibility rewrite inside code-like text.
            output += transformText(line.slice(textStart, openerStart));
            output += line.slice(openerStart);
            return output;
          }

          output += transformText(line.slice(textStart, openerStart));
          output += line.slice(openerStart, closerStart + runLength);
          cursor = closerStart + runLength;
          textStart = cursor;
        }

        output += transformText(line.slice(textStart));
        return output;
      }

      function findMatchingBacktickRun(line, start, runLength) {
        let cursor = start;
        while (cursor < line.length) {
          if (line[cursor] !== '`' || isEscapedAt(line, cursor)) {
            cursor += 1;
            continue;
          }
          const runStart = cursor;
          while (cursor < line.length && line[cursor] === '`') cursor += 1;
          if (cursor - runStart === runLength) return runStart;
        }
        return -1;
      }

      function isEscapedAt(text, index) {
        let slashes = 0;
        for (let cursor = index - 1; cursor >= 0 && text[cursor] === '\\'; cursor -= 1) slashes += 1;
        return (slashes % 2) === 1;
      }

      function postProcess() {
        applyJapaneseCompatibility(els.rendered);
        els.rendered.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.disabled = true;
        });

        els.rendered.querySelectorAll('a').forEach(a => {
          const href = a.getAttribute('href') || '';
          if (!href.startsWith('#') && !/^(https?:|mailto:|tel:)/i.test(href)) {
            a.addEventListener('click', e => e.preventDefault());
          }
        });

        els.rendered.querySelectorAll('table').forEach(table => {
          if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
          const wrap = document.createElement('div');
          wrap.className = 'table-wrap';
          table.parentNode.insertBefore(wrap, table);
          wrap.appendChild(table);
        });
      }

      async function renderMarkdown(source, fileName, statusOverride = null) {
        if (!md && !initMarkdown()) return;

        try {
          const cleanSource = source.replace(/^\uFEFF/, '');
          const renderSource = prepareJapaneseCompatibleSource(cleanSource);
          const html = md.render(renderSource);
          els.rendered.innerHTML = sanitize(html);
          postProcess();

          currentFileName = fileName;
          currentSource = cleanSource;
          hasDocument = true;
          els.fileName.textContent = fileName;
          document.title = `${fileName} — Markdown Print Viewer`;
          els.emptyState.hidden = true;
          els.rendered.hidden = false;
          els.printBtn.disabled = false;
          refreshWordButton();

          const imageResult = await resolveLocalImages();
          if (statusOverride) {
            setStatus(statusOverride, 'ok');
          } else if (imageResult.total > 0) {
            setStatus(t('loadedImages', imageResult.resolved, imageResult.total), imageResult.resolved === imageResult.total ? 'ok' : 'error');
          } else {
            setStatus(t('loaded'), 'ok');
          }
          els.workspace.scrollTop = 0;
          els.workspace.scrollLeft = 0;
          window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
          return imageResult;
        } catch (err) {
          console.error(err);
          els.rendered.innerHTML = `<div class="load-error">${escapeHtml(t('readError'))}</div>`;
          els.emptyState.hidden = true;
          els.rendered.hidden = false;
          setStatus(t('readError'), 'error');
        }
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>\"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));
      }

      function looksLikeMarkdown(file) {
        return !!file && (/\.(md|markdown|mdown|mkd)$/i.test(file.name) || file.type === 'text/markdown' || file.type === 'text/plain' || !file.type);
      }

      function fileFingerprint(file) {
        return file ? `${file.name}\n${file.size}\n${file.lastModified}` : '';
      }

      async function identifyMarkdownPathInFolder(file) {
        if (!file || !folderFiles.size) return null;

        // Fast path: exact metadata match, usually sufficient for a dropped File.
        const fp = fileFingerprint(file);
        let candidates = [...folderFiles.entries()].filter(([, candidate]) => fileFingerprint(candidate) === fp);
        if (candidates.length === 1) return candidates[0][0];

        // Narrow by filename, then compare actual Markdown text if needed.
        candidates = [...folderFiles.entries()].filter(([, candidate]) => candidate.name.toLowerCase() === file.name.toLowerCase());
        if (candidates.length === 1) return candidates[0][0];
        if (candidates.length > 1 && currentSource) {
          for (const [path, candidate] of candidates) {
            try {
              const text = (await candidate.text()).replace(/^\uFEFF/, '');
              if (text === currentSource) return path;
            } catch (_) {}
          }
        }
        return null;
      }

      async function openFile(file, knownPath = null, statusOverride = null) {
        if (!file) return;
        if (!looksLikeMarkdown(file)) {
          setStatus(t('invalid'), 'error');
          return;
        }

        setStatus(t('loading'));
        try {
          const text = await file.text();
          currentFile = file;
          currentMarkdownPath = knownPath ? normalizePath(knownPath) : null;

          if (!currentMarkdownPath && folderFiles.size) {
            currentSource = text.replace(/^\uFEFF/, '');
            currentMarkdownPath = await identifyMarkdownPathInFolder(file);
            if (!currentMarkdownPath) currentMarkdownPath = file.name; // selected folder root as explicit fallback base
          }

          await renderMarkdown(text, file.name, statusOverride);
        } catch (err) {
          console.error(err);
          setStatus(t('readError'), 'error');
        }
      }

      function relativePathWithoutRoot(file) {
        const raw = String(file.webkitRelativePath || '').replace(/\\/g, '/');
        if (!raw) return file.name;
        const parts = raw.split('/').filter(Boolean);
        if (parts.length > 1) parts.shift(); // strip selected root folder name
        return normalizePath(parts.join('/')) || file.name;
      }

      async function loadFolderFileList(files) {
        const list = [...files];
        if (!list.length) return false;

        folderFiles = new Map();
        const rawFirst = String(list[0].webkitRelativePath || '').replace(/\\/g, '/');
        folderRootPrefix = rawFirst.includes('/') ? rawFirst.split('/')[0] : '';
        currentFolderName = folderRootPrefix || currentFolderName || 'Selected Folder';

        for (const file of list) {
          const path = relativePathWithoutRoot(file);
          if (path) folderFiles.set(path, file);
        }
        updateFolderLabel();
        return true;
      }

      function rootMarkdownEntries() {
        return [...folderFiles.entries()].filter(([path, file]) => !path.includes('/') && /\.(md|markdown|mdown|mkd)$/i.test(file.name));
      }

      async function handleFolderSelection(files) {
        setStatus(t('folderLoading'));
        const loaded = await loadFolderFileList(files);
        if (!loaded) {
          setStatus(t('folderCancelled'));
          return;
        }

        if (!hasDocument) {
          const rootMd = rootMarkdownEntries();
          if (rootMd.length === 1) {
            const [path, file] = rootMd[0];
            await openFile(file, path, t('autoOpened', file.name));
          } else if (rootMd.length === 0) {
            setStatus(t('rootMdNone'), 'ok');
          } else {
            setStatus(t('rootMdMany', rootMd.length), 'ok');
          }
          return;
        }

        // Existing Markdown is intentionally preserved. Only establish/refresh its base path and images.
        const matchedPath = await identifyMarkdownPathInFolder(currentFile);
        const exact = !!matchedPath;
        currentMarkdownPath = matchedPath || currentFileName; // root fallback if the Markdown itself is outside/not identifiable
        const imageResult = await renderMarkdown(currentSource, currentFileName);

        if (imageResult && imageResult.total > 0) {
          setStatus(t('folderReadyImages', currentFolderName, imageResult.resolved, imageResult.total), imageResult.resolved === imageResult.total ? 'ok' : 'error');
        } else {
          setStatus(exact ? t('folderReady', currentFolderName) : t('folderFallback', currentFolderName), exact ? 'ok' : 'error');
        }
      }



      function wordFontAttributes() {
        const key = els.fontSelect.value;
        const fonts = {
          standard: { ascii: 'Aptos', hAnsi: 'Aptos', eastAsia: 'Yu Gothic', cs: 'Aptos' },
          meiryo: { ascii: 'Meiryo', hAnsi: 'Meiryo', eastAsia: 'Meiryo', cs: 'Meiryo' },
          yugothic: { ascii: 'Yu Gothic', hAnsi: 'Yu Gothic', eastAsia: 'Yu Gothic', cs: 'Yu Gothic' },
          bizudpgothic: { ascii: 'BIZ UDPGothic', hAnsi: 'BIZ UDPGothic', eastAsia: 'BIZ UDPGothic', cs: 'BIZ UDPGothic' },
          yumincho: { ascii: 'Yu Mincho', hAnsi: 'Yu Mincho', eastAsia: 'Yu Mincho', cs: 'Yu Mincho' },
          bizudpmincho: { ascii: 'BIZ UDPMincho', hAnsi: 'BIZ UDPMincho', eastAsia: 'BIZ UDPMincho', cs: 'BIZ UDPMincho' }
        };
        return fonts[key] || fonts.standard;
      }

      function wordBaseSizeHalfPoints() {
        const pt = Number.parseFloat(els.sizeSelect.value || '10.5');
        return Math.max(16, Math.round((Number.isFinite(pt) ? pt : 10.5) * 2));
      }

      function wordBodyBold() {
        return Number.parseInt(els.weightSelect.value || '400', 10) >= 600;
      }

      function docxAvailable() {
        return !!(window.docx && window.docx.Document && window.docx.Packer && window.docx.Paragraph && window.docx.TextRun);
      }

      function refreshWordButton() {
        els.wordBtn.disabled = !(hasDocument && docxAvailable());
        els.wordBtn.title = docxAvailable() ? t('wordTitle') : t('wordUnavailable');
      }

      function docxDownloadName() {
        const base = (currentFileName || 'document').replace(/\.(md|markdown|mdown|mkd)$/i, '') || 'document';
        return `${base}.docx`;
      }

      function normalizeInlineText(text) {
        return String(text || '').replace(/[\t\r\n ]+/g, ' ');
      }

      function wordRunOptions(text, style = {}) {
        const baseSize = wordBaseSizeHalfPoints();
        const size = style.size || baseSize;
        const options = {
          text: String(text || ''),
          font: style.code
            ? { ascii: 'Consolas', hAnsi: 'Consolas', eastAsia: 'Yu Gothic', cs: 'Consolas' }
            : wordFontAttributes(),
          size,
          bold: !!(style.bold || (!style.heading && !style.code && wordBodyBold())),
          italics: !!style.italics,
          strike: !!style.strike,
          superScript: !!style.superScript,
          subScript: !!style.subScript
        };
        if (style.hyperlink) options.style = 'Hyperlink';
        if (style.color) options.color = style.color;
        if (style.code) options.shading = { fill: 'F3F4F6' };
        return options;
      }

      function wordTextRun(text, style = {}) {
        return new window.docx.TextRun(wordRunOptions(text, style));
      }

      function imageDisplaySize(img) {
        let width = Number(img.naturalWidth || img.width || 640);
        let height = Number(img.naturalHeight || img.height || 360);
        if (!Number.isFinite(width) || width <= 0) width = 640;
        if (!Number.isFinite(height) || height <= 0) height = 360;
        const maxWidth = 600;
        const maxHeight = 780;
        const scale = Math.min(1, maxWidth / width, maxHeight / height);
        return {
          width: Math.max(1, Math.round(width * scale)),
          height: Math.max(1, Math.round(height * scale))
        };
      }

      async function loadImageElementFromBlob(blob) {
        const url = URL.createObjectURL(blob);
        try {
          const image = new Image();
          image.decoding = 'async';
          image.src = url;
          if (typeof image.decode === 'function') {
            await image.decode();
          } else {
            await new Promise((resolve, reject) => {
              image.onload = resolve;
              image.onerror = reject;
            });
          }
          return image;
        } finally {
          // The decoded pixels stay available after revoking the temporary source URL.
          URL.revokeObjectURL(url);
        }
      }

      async function imageToPngData(img) {
        const rawSrc = img.getAttribute('src') || '';
        const original = img.dataset.originalSrc || rawSrc;
        if (img.classList.contains('local-image-missing')) throw new Error(`Local image not found: ${original}`);
        if (isLocalRelativeUrl(original) && !String(rawSrc).startsWith('blob:') && !String(rawSrc).startsWith('data:')) {
          throw new Error(`Open Folder is required for local image: ${original}`);
        }

        let sourceImage = img;
        let remoteBlob = null;
        const src = img.currentSrc || img.src || rawSrc;

        if (/^https?:/i.test(src)) {
          try {
            const response = await fetch(src, { mode: 'cors', credentials: 'omit' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            remoteBlob = await response.blob();
            sourceImage = await loadImageElementFromBlob(remoteBlob);
          } catch (_) {
            sourceImage = img;
          }
        } else if (typeof img.decode === 'function' && !img.complete) {
          try { await img.decode(); } catch (_) {}
        }

        const naturalWidth = Number(sourceImage.naturalWidth || sourceImage.width || img.naturalWidth || img.width || 640);
        const naturalHeight = Number(sourceImage.naturalHeight || sourceImage.height || img.naturalHeight || img.height || 360);
        if (!naturalWidth || !naturalHeight) throw new Error(`Image data unavailable: ${original}`);

        const rasterMax = 1800;
        const rasterScale = Math.min(1, rasterMax / naturalWidth, rasterMax / naturalHeight);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(naturalWidth * rasterScale));
        canvas.height = Math.max(1, Math.round(naturalHeight * rasterScale));
        const ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('Canvas is unavailable.');
        ctx.drawImage(sourceImage, 0, 0, canvas.width, canvas.height);

        const pngBlob = await new Promise((resolve, reject) => {
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Image conversion failed.')), 'image/png');
        });
        return {
          data: await pngBlob.arrayBuffer(),
          transformation: imageDisplaySize(sourceImage)
        };
      }

      async function wordImageChild(img, stats) {
        stats.imagesTotal += 1;
        try {
          const converted = await imageToPngData(img);
          stats.imagesEmbedded += 1;
          return new window.docx.ImageRun({
            data: converted.data,
            transformation: converted.transformation,
            type: 'png'
          });
        } catch (err) {
          console.warn('DOCX image skipped:', err);
          stats.imagesMissing += 1;
          const alt = img.getAttribute('alt') || img.dataset.originalSrc || img.getAttribute('src') || 'image';
          return wordTextRun(`[Image: ${alt}]`, { italics: true, color: '6B7280' });
        }
      }

      async function inlineToWord(nodes, style, stats) {
        const out = [];
        const inherited = style || {};

        for (const node of [...nodes]) {
          if (node.nodeType === Node.TEXT_NODE) {
            const text = inherited.code ? String(node.nodeValue || '') : normalizeInlineText(node.nodeValue || '');
            if (text) out.push(wordTextRun(text, inherited));
            continue;
          }
          if (node.nodeType !== Node.ELEMENT_NODE) continue;

          const el = node;
          const tag = el.tagName.toLowerCase();
          if (tag === 'strong' || tag === 'b') {
            out.push(...await inlineToWord(el.childNodes, { ...inherited, bold: true }, stats));
          } else if (tag === 'em' || tag === 'i') {
            out.push(...await inlineToWord(el.childNodes, { ...inherited, italics: true }, stats));
          } else if (tag === 'del' || tag === 's' || tag === 'strike') {
            out.push(...await inlineToWord(el.childNodes, { ...inherited, strike: true }, stats));
          } else if (tag === 'code') {
            out.push(...await inlineToWord(el.childNodes, { ...inherited, code: true }, stats));
          } else if (tag === 'sup') {
            out.push(...await inlineToWord(el.childNodes, { ...inherited, superScript: true }, stats));
          } else if (tag === 'sub') {
            out.push(...await inlineToWord(el.childNodes, { ...inherited, subScript: true }, stats));
          } else if (tag === 'br') {
            out.push(new window.docx.TextRun({ ...wordRunOptions('', inherited), break: 1 }));
          } else if (tag === 'img') {
            out.push(await wordImageChild(el, stats));
          } else if (tag === 'input' && String(el.getAttribute('type') || '').toLowerCase() === 'checkbox') {
            out.push(wordTextRun(el.checked ? '☒ ' : '☐ ', inherited));
          } else if (tag === 'a') {
            const href = el.getAttribute('href') || '';
            const children = await inlineToWord(el.childNodes, { ...inherited, hyperlink: true }, stats);
            if (/^(https?:|mailto:|tel:)/i.test(href) && children.length) {
              out.push(new window.docx.ExternalHyperlink({ children, link: href }));
            } else {
              out.push(...children);
            }
          } else if (tag === 'kbd') {
            out.push(...await inlineToWord(el.childNodes, { ...inherited, code: true, bold: true }, stats));
          } else {
            out.push(...await inlineToWord(el.childNodes, inherited, stats));
          }
        }
        return out;
      }

      function paragraphBaseOptions(context = {}) {
        const options = {
          spacing: { after: 110 },
          autoSpaceEastAsianText: true
        };
        if (context.quoteLevel) {
          options.indent = { left: Math.min(1440, 360 * context.quoteLevel) };
          options.border = {
            left: { style: window.docx.BorderStyle.SINGLE, size: 8, color: 'D0D7DE', space: 6 }
          };
        }
        return options;
      }

      async function paragraphFromElement(el, context, stats, extra = {}) {
        const children = await inlineToWord(el.childNodes, extra.inlineStyle || {}, stats);
        return new window.docx.Paragraph({
          ...paragraphBaseOptions(context),
          ...extra.options,
          children: children.length ? children : [wordTextRun('')]
        });
      }

      async function listToWord(listEl, context, stats) {
        const blocks = [];
        const ordered = listEl.tagName.toLowerCase() === 'ol';
        const level = Math.min(8, context.listLevel || 0);
        const listInstance = ordered ? (++stats.numberingInstance) : null;
        const directItems = [...listEl.children].filter(child => child.tagName && child.tagName.toLowerCase() === 'li');

        for (const li of directItems) {
          const childElements = [...li.children];
          const nestedLists = childElements.filter(child => /^(ul|ol)$/i.test(child.tagName));
          const directParagraphs = childElements.filter(child => child.tagName && child.tagName.toLowerCase() === 'p');

          let primaryNodes;
          if (directParagraphs.length) {
            primaryNodes = directParagraphs[0].childNodes;
          } else {
            primaryNodes = [...li.childNodes].filter(node => !(node.nodeType === Node.ELEMENT_NODE && /^(ul|ol)$/i.test(node.tagName)));
          }

          const listOptions = paragraphBaseOptions(context);
          listOptions.spacing = { after: 45 };
          if (ordered) {
            listOptions.numbering = { reference: 'markdown-numbering', level, instance: listInstance };
          } else {
            listOptions.bullet = { level };
          }
          const primaryChildren = await inlineToWord(primaryNodes, {}, stats);
          blocks.push(new window.docx.Paragraph({
            ...listOptions,
            children: primaryChildren.length ? primaryChildren : [wordTextRun('')]
          }));

          for (const p of directParagraphs.slice(1)) {
            blocks.push(await paragraphFromElement(p, context, stats, {
              options: { indent: { left: 720 * (level + 1) }, spacing: { after: 45 } }
            }));
          }

          for (const nested of nestedLists) {
            blocks.push(...await listToWord(nested, { ...context, listLevel: level + 1 }, stats));
          }
        }
        return blocks;
      }

      async function tableToWord(tableEl, context, stats) {
        const rows = [];
        const trElements = [...tableEl.querySelectorAll(':scope > thead > tr, :scope > tbody > tr, :scope > tfoot > tr, :scope > tr')];
        for (const tr of trElements) {
          const cells = [];
          for (const cell of [...tr.children].filter(el => /^(th|td)$/i.test(el.tagName))) {
            const isHeader = cell.tagName.toLowerCase() === 'th';
            const children = await inlineToWord(cell.childNodes, { bold: isHeader }, stats);
            cells.push(new window.docx.TableCell({
              children: [new window.docx.Paragraph({
                spacing: { after: 0 },
                children: children.length ? children : [wordTextRun('')]
              })]
            }));
          }
          if (cells.length) rows.push(new window.docx.TableRow({ children: cells }));
        }
        if (!rows.length) return [];
        return [new window.docx.Table({
          rows,
          width: { size: 100, type: window.docx.WidthType.PERCENTAGE }
        })];
      }

      function codeParagraph(preEl, context) {
        const text = preEl.textContent || '';
        const lines = text.replace(/\n$/, '').split('\n');
        const children = [];
        lines.forEach((line, index) => {
          children.push(wordTextRun(line, { code: true }));
          if (index < lines.length - 1) {
            children.push(new window.docx.TextRun({ ...wordRunOptions('', { code: true }), break: 1 }));
          }
        });
        return new window.docx.Paragraph({
          ...paragraphBaseOptions(context),
          spacing: { before: 60, after: 110 },
          shading: { fill: 'F6F8FA' },
          children: children.length ? children : [wordTextRun('', { code: true })]
        });
      }

      async function blocksToWord(parent, context, stats) {
        const blocks = [];
        for (const node of [...parent.childNodes]) {
          if (node.nodeType === Node.TEXT_NODE) {
            const text = normalizeInlineText(node.nodeValue || '').trim();
            if (text) blocks.push(new window.docx.Paragraph({ ...paragraphBaseOptions(context), children: [wordTextRun(text)] }));
            continue;
          }
          if (node.nodeType !== Node.ELEMENT_NODE) continue;

          const el = node;
          const tag = el.tagName.toLowerCase();
          if (/^h[1-6]$/.test(tag)) {
            const level = Number(tag.slice(1));
            const headingMap = [
              window.docx.HeadingLevel.HEADING_1,
              window.docx.HeadingLevel.HEADING_2,
              window.docx.HeadingLevel.HEADING_3,
              window.docx.HeadingLevel.HEADING_4,
              window.docx.HeadingLevel.HEADING_5,
              window.docx.HeadingLevel.HEADING_6
            ];
            const factors = [2, 1.5, 1.25, 1, 0.875, 0.85];
            const size = Math.max(16, Math.round(wordBaseSizeHalfPoints() * factors[level - 1]));
            const children = await inlineToWord(el.childNodes, { bold: true, heading: true, size }, stats);
            blocks.push(new window.docx.Paragraph({
              ...paragraphBaseOptions(context),
              heading: headingMap[level - 1],
              spacing: { before: level <= 2 ? 220 : 150, after: 90 },
              children: children.length ? children : [wordTextRun('', { bold: true, heading: true, size })]
            }));
          } else if (tag === 'p') {
            blocks.push(await paragraphFromElement(el, context, stats));
          } else if (tag === 'ul' || tag === 'ol') {
            blocks.push(...await listToWord(el, { ...context, listLevel: context.listLevel || 0 }, stats));
          } else if (tag === 'blockquote') {
            blocks.push(...await blocksToWord(el, { ...context, quoteLevel: (context.quoteLevel || 0) + 1 }, stats));
          } else if (tag === 'table') {
            blocks.push(...await tableToWord(el, context, stats));
          } else if (tag === 'div' && el.classList.contains('table-wrap')) {
            const table = el.querySelector(':scope > table');
            if (table) blocks.push(...await tableToWord(table, context, stats));
          } else if (tag === 'pre') {
            blocks.push(codeParagraph(el, context));
          } else if (tag === 'hr') {
            blocks.push(new window.docx.Paragraph({
              spacing: { before: 80, after: 120 },
              border: { bottom: { style: window.docx.BorderStyle.SINGLE, size: 6, color: 'D8DEE4' } },
              children: [wordTextRun('')]
            }));
          } else if (tag === 'details') {
            const summary = [...el.children].find(child => child.tagName && child.tagName.toLowerCase() === 'summary');
            if (summary) {
              const summaryChildren = await inlineToWord(summary.childNodes, { bold: true }, stats);
              blocks.push(new window.docx.Paragraph({
                ...paragraphBaseOptions(context),
                children: summaryChildren.length ? summaryChildren : [wordTextRun('')]
              }));
            }
            const holder = document.createElement('div');
            [...el.childNodes].forEach(child => {
              if (!(child.nodeType === Node.ELEMENT_NODE && child.tagName.toLowerCase() === 'summary')) holder.appendChild(child.cloneNode(true));
            });
            blocks.push(...await blocksToWord(holder, context, stats));
          } else if (tag === 'section' || tag === 'article' || tag === 'main' || tag === 'div') {
            blocks.push(...await blocksToWord(el, context, stats));
          } else {
            const children = await inlineToWord(el.childNodes, {}, stats);
            if (children.length) {
              stats.flattenedBlocks += 1;
              blocks.push(new window.docx.Paragraph({ ...paragraphBaseOptions(context), children }));
            }
          }
        }
        return blocks;
      }

      function markdownNumberingLevels() {
        return Array.from({ length: 9 }, (_, level) => ({
          level,
          format: window.docx.LevelFormat.DECIMAL,
          text: `%${level + 1}.`,
          alignment: window.docx.AlignmentType.LEFT,
          style: {
            paragraph: {
              indent: { left: 720 * (level + 1), hanging: 360 }
            }
          }
        }));
      }

      async function exportWord() {
        if (!hasDocument) return;
        if (!docxAvailable()) {
          setStatus(t('wordUnavailable'), 'error');
          return;
        }

        const oldText = els.wordBtn.textContent;
        els.wordBtn.disabled = true;
        els.printBtn.disabled = true;
        setStatus(t('wordExporting'));
        try {
          const stats = {
            imagesTotal: 0,
            imagesEmbedded: 0,
            imagesMissing: 0,
            numberingInstance: 0,
            flattenedBlocks: 0
          };
          const blocks = await blocksToWord(els.rendered, { listLevel: 0, quoteLevel: 0 }, stats);
          if (!blocks.length) blocks.push(new window.docx.Paragraph({ children: [wordTextRun('')] }));

          const doc = new window.docx.Document({
            title: currentFileName || 'Markdown document',
            creator: 'Markdown Print Viewer',
            description: 'Generated from Markdown by Markdown Print Viewer',
            numbering: {
              config: [{ reference: 'markdown-numbering', levels: markdownNumberingLevels() }]
            },
            sections: [{
              properties: {
                page: {
                  size: { width: 11906, height: 16838 },
                  margin: { top: 1134, right: 1134, bottom: 1134, left: 1134 }
                }
              },
              children: blocks
            }]
          });

          const blob = await window.docx.Packer.toBlob(doc);
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = docxDownloadName();
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 30000);

          if (stats.imagesTotal > 0) {
            setStatus(t('wordExportedImages', stats.imagesEmbedded, stats.imagesTotal), stats.imagesMissing ? 'error' : 'ok');
          } else {
            setStatus(t('wordExported'), 'ok');
          }
        } catch (err) {
          console.error('DOCX export failed:', err);
          setStatus(t('wordError'), 'error');
        } finally {
          els.wordBtn.textContent = oldText;
          els.printBtn.disabled = !hasDocument;
          refreshWordButton();
        }
      }

      els.brandToggle.addEventListener('click', toggleControls);
      els.brandToggle.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleControls();
        }
      });

      els.openBtn.addEventListener('click', () => els.fileInput.click());
      els.fileInput.addEventListener('change', async () => {
        const file = els.fileInput.files && els.fileInput.files[0];
        await openFile(file);
        els.fileInput.value = '';
      });

      els.folderBtn.addEventListener('click', () => {
        if (!('webkitdirectory' in els.folderInput)) {
          setStatus(t('folderUnsupported'), 'error');
          return;
        }
        els.folderInput.click();
      });
      els.folderInput.addEventListener('change', async () => {
        const files = els.folderInput.files;
        await handleFolderSelection(files || []);
        // Reset so the same folder can be deliberately selected again later.
        els.folderInput.value = '';
      });

      els.wordBtn.addEventListener('click', exportWord);

      els.printBtn.addEventListener('click', () => {
        if (hasDocument) window.print();
      });
      els.themeBtn.addEventListener('click', toggleTheme);
      els.japaneseCompat.addEventListener('change', async () => {
        localStorage.setItem('mpv.japaneseCompatibility', els.japaneseCompat.checked ? '1' : '0');
        if (hasDocument) await renderMarkdown(currentSource, currentFileName);
      });
      els.fontSelect.addEventListener('change', () => applyTypography(true));
      els.sizeSelect.addEventListener('change', () => applyTypography(true));
      els.weightSelect.addEventListener('change', () => applyTypography(true));
      els.langBtn.addEventListener('click', () => {
        language = language === 'ja' ? 'en' : 'ja';
        localStorage.setItem('mpv.lang', language);
        applyLanguage();
      });

      window.addEventListener('dragenter', e => {
        e.preventDefault();
        dragDepth += 1;
        els.dropOverlay.classList.add('active');
      });
      window.addEventListener('dragover', e => {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      });
      window.addEventListener('dragleave', e => {
        e.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) els.dropOverlay.classList.remove('active');
      });
      window.addEventListener('drop', async e => {
        e.preventDefault();
        dragDepth = 0;
        els.dropOverlay.classList.remove('active');
        const files = [...(e.dataTransfer?.files || [])];
        const markdownFile = files.find(f => /\.(md|markdown|mdown|mkd)$/i.test(f.name)) || files[0];
        await openFile(markdownFile);
      });

      // Keyboard: Ctrl/Cmd+O = open Markdown; Ctrl/Cmd+P remains browser-native print.
      window.addEventListener('keydown', e => {
        const mod = e.ctrlKey || e.metaKey;
        if (mod && e.key.toLowerCase() === 'o') {
          e.preventDefault();
          els.fileInput.click();
        }
      });

      window.addEventListener('beforeunload', revokeObjectUrls);

      initTheme();
      initTypography();
      els.japaneseCompat.checked = localStorage.getItem('mpv.japaneseCompatibility') === '1';
      applyLanguage();
      initMarkdown();
      refreshWordButton();
    })();
