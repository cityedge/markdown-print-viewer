  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a20;
      --panel-2: #1d2129;
      --border: #2b313b;
      --text: #e8eaed;
      --muted: #9aa3af;
      --accent: #ff9f43;
      --accent-soft: rgba(255, 159, 67, .14);
      --paper: #ffffff;
      --paper-text: #24292f;
      --paper-muted: #57606a;
      --paper-border: #d0d7de;
      --paper-code: #f6f8fa;
      --paper-quote: #656d76;
      --page-width: 210mm;
      --shadow: 0 18px 55px rgba(0,0,0,.38);
      --ui-font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      --doc-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      --doc-size: 10.5pt;
      --doc-weight: 400;
      --mono-font: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }

    html[data-theme="light"] {
      --bg: #eef1f5;
      --panel: #ffffff;
      --panel-2: #f6f8fa;
      --border: #d0d7de;
      --text: #24292f;
      --muted: #66707b;
      --shadow: 0 16px 42px rgba(31,35,40,.15);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui-font);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 10px 16px;
      background: color-mix(in srgb, var(--panel) 93%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
      min-width: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #141414;
      background: var(--accent);
      font-weight: 800;
      letter-spacing: -.04em;
      user-select: none;
    }

    .brand-copy { min-width: 0; }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
    }
    .file-name {
      margin-top: 3px;
      max-width: 44vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 11px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font: 600 13px/1 var(--ui-font);
      padding: 10px 13px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .05s ease;
    }
    button:hover { border-color: #56606d; }
    button:active { transform: translateY(1px); }
    button.primary {
      border-color: color-mix(in srgb, var(--accent) 65%, var(--border));
      background: var(--accent-soft);
      color: var(--accent);
    }
    button:disabled {
      opacity: .42;
      cursor: default;
      transform: none;
    }

    .type-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 2px;
    }
    .type-control {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .type-control label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      user-select: none;
    }
    .type-control select {
      appearance: none;
      min-height: 34px;
      padding: 7px 25px 7px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--panel-2);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 11px) 14px,
        calc(100% - 7px) 14px;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
      color: var(--text);
      font: 600 11px/1 var(--ui-font);
      cursor: pointer;
    }
    .type-control select:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 72%, transparent);
      outline-offset: 1px;
    }
    #fontSelect { width: 122px; }
    #sizeSelect { width: 72px; }
    #weightSelect { width: 94px; }

    .statusbar {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 34px;
      padding: 6px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #69717d;
      flex: 0 0 auto;
    }
    .status-dot.ok { background: #4caf73; }
    .status-dot.error { background: #e35d6a; }
    .status-spacer { margin-left: auto; }
    .compat { white-space: nowrap; }

    .workspace {
      position: relative;
      padding: 28px 18px 60px;
      overflow: auto;
    }

    .paper {
      width: min(var(--page-width), calc(100vw - 36px));
      min-height: 297mm;
      margin: 0 auto;
      padding: 20mm 20mm 24mm;
      background: var(--paper);
      color: var(--paper-text);
      box-shadow: var(--shadow);
      border-radius: 2px;
    }

    .empty-state {
      min-height: 245mm;
      display: grid;
      place-items: center;
      text-align: center;
      color: #8c959f;
    }
    .empty-state[hidden] { display: none !important; }
    .empty-inner { max-width: 520px; }
    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 2px dashed #c7cdd3;
      border-radius: 16px;
      font: 700 23px/1 var(--mono-font);
      color: #68717b;
    }
    .empty-state h1 {
      margin: 0 0 10px;
      border: 0;
      font: 700 21px/1.35 var(--doc-font);
      color: #49515a;
    }
    .empty-state p {
      margin: 0;
      font: 14px/1.8 var(--doc-font);
    }

    .drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      background: rgba(10,12,16,.82);
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    .drop-overlay.active { display: grid; }
    .drop-card {
      min-width: min(520px, 80vw);
      padding: 40px;
      border: 2px dashed var(--accent);
      border-radius: 18px;
      color: var(--text);
      text-align: center;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .drop-card strong { color: var(--accent); }

    #fileInput, #folderInput { display: none; }

    /* Markdown document styling — intentionally GitHub-like, optimized for print. */
    .markdown-body {
      font-family: var(--doc-font);
      font-size: var(--doc-size);
      font-weight: var(--doc-weight);
      line-height: 1.48;
      overflow-wrap: break-word;
      word-break: normal;
      line-break: strict;
      text-rendering: optimizeLegibility;
    }

    .markdown-body > :first-child { margin-top: 0 !important; }
    .markdown-body > :last-child { margin-bottom: 0 !important; }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin-top: 1.25em;
      margin-bottom: .45em;
      font-weight: 700;
      line-height: 1.28;
      break-after: avoid-page;
      page-break-after: avoid;
    }
    .markdown-body h1 {
      padding-bottom: .28em;
      border-bottom: 1px solid var(--paper-border);
      font-size: 2em;
    }
    .markdown-body h2 {
      padding-bottom: .25em;
      border-bottom: 1px solid var(--paper-border);
      font-size: 1.5em;
    }
    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body h4 { font-size: 1em; }
    .markdown-body h5 { font-size: .875em; }
    .markdown-body h6 { font-size: .85em; color: var(--paper-muted); }

    .markdown-body p,
    .markdown-body blockquote,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body dl,
    .markdown-body table,
    .markdown-body pre,
    .markdown-body details {
      margin-top: 0;
      margin-bottom: .65em;
    }

    .markdown-body ul,
    .markdown-body ol { padding-left: 2em; }
    .markdown-body li + li { margin-top: .12em; }
    .markdown-body li > p { margin-top: .45em; }
    .markdown-body ul ul,
    .markdown-body ul ol,
    .markdown-body ol ol,
    .markdown-body ol ul { margin-top: 0; margin-bottom: 0; }

    .markdown-body blockquote {
      padding: .15em 1em;
      color: var(--paper-quote);
      border-left: .25em solid #d0d7de;
    }
    .markdown-body blockquote > :first-child { margin-top: 0; }
    .markdown-body blockquote > :last-child { margin-bottom: 0; }

    .markdown-body code,
    .markdown-body tt {
      margin: 0;
      padding: .18em .36em;
      border-radius: 4px;
      background: rgba(175,184,193,.2);
      font-family: var(--mono-font);
      font-size: 85%;
    }

    .markdown-body pre {
      overflow: auto;
      padding: 15px 16px;
      border-radius: 7px;
      background: var(--paper-code);
      font-size: 85%;
      line-height: 1.45;
      white-space: pre-wrap;
      break-inside: auto;
    }
    .markdown-body pre code {
      display: inline;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 100%;
      white-space: inherit;
    }

    .markdown-body a {
      color: #0969da;
      text-decoration: none;
    }
    .markdown-body a:hover { text-decoration: underline; }

    .markdown-body img {
      max-width: 100%;
      height: auto;
      box-sizing: content-box;
      background: #fff;
      break-inside: avoid;
      page-break-inside: avoid;
    }


    .markdown-body img.local-image-missing {
      min-width: 120px;
      min-height: 42px;
      outline: 1px dashed #d0d7de;
      outline-offset: 3px;
    }

    .markdown-body hr {
      height: .25em;
      margin: 1.1em 0;
      padding: 0;
      border: 0;
      background: #d8dee4;
    }

    .markdown-body table {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      border-spacing: 0;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    .markdown-body tr { background: #fff; border-top: 1px solid #d8dee4; }
    .markdown-body tr:nth-child(2n) { background: #f6f8fa; }
    .markdown-body th,
    .markdown-body td {
      padding: 6px 13px;
      border: 1px solid var(--paper-border);
      vertical-align: top;
    }
    .markdown-body th { font-weight: 700; }

    .markdown-body input[type="checkbox"] {
      margin: 0 .5em 0 -.2em;
      vertical-align: middle;
      accent-color: #0969da;
    }
    .markdown-body .contains-task-list { list-style: none; padding-left: 1.45em; }
    .markdown-body .task-list-item { list-style: none; }

    .markdown-body kbd {
      display: inline-block;
      padding: 2px 5px;
      border: 1px solid #afb8c1;
      border-bottom-width: 2px;
      border-radius: 5px;
      background: #f6f8fa;
      box-shadow: inset 0 -1px 0 #afb8c1;
      font: 11px var(--mono-font);
      line-height: 10px;
      color: #24292f;
      vertical-align: middle;
    }

    .markdown-body details {
      padding: .6em .8em;
      border: 1px solid var(--paper-border);
      border-radius: 6px;
      break-inside: avoid-page;
    }
    .markdown-body summary { cursor: pointer; font-weight: 600; }

    .markdown-body .footnotes-sep { margin-top: 2.2em; }
    .markdown-body .footnotes {
      color: var(--paper-muted);
      font-size: .88em;
    }
    .markdown-body .footnote-backref { margin-left: .25em; }

    .markdown-body .table-wrap {
      max-width: 100%;
      overflow-x: auto;
    }

    .load-error {
      padding: 16px;
      border: 1px solid #ffb3bb;
      border-radius: 8px;
      background: #fff3f4;
      color: #9f1c2c;
      font: 14px/1.65 var(--doc-font);
    }

    @media (max-width: 780px) {
      .toolbar { flex-wrap: wrap; }
      .brand { width: 100%; }
      .type-controls { order: 5; width: 100%; flex-wrap: wrap; }
      .file-name { max-width: 72vw; }
      .workspace { padding: 12px 8px 30px; }
      .paper {
        width: 100%;
        min-height: 0;
        padding: 24px 18px 36px;
      }
      .statusbar { overflow-x: auto; }
    }

    @page {
      size: A4 portrait;
      margin: 18mm 18mm 20mm;
    }

    @media print {
      html, body {
        width: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        color: #000 !important;
      }

      .toolbar,
      .statusbar,
      .drop-overlay {
        display: none !important;
      }

      .app,
      .workspace {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        background: #fff !important;
      }

      .paper {
        width: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: #fff !important;
        color: #000 !important;
      }

      .empty-state { display: none !important; }
      .markdown-body { font-size: var(--doc-size); line-height: 1.45; }

      .markdown-body a {
        color: inherit !important;
        text-decoration: underline;
        text-decoration-thickness: .05em;
        text-underline-offset: .12em;
      }

      .markdown-body pre,
      .markdown-body blockquote,
      .markdown-body table,
      .markdown-body img,
      .markdown-body details {
        break-inside: avoid-page;
        page-break-inside: avoid;
      }

      .markdown-body table {
        display: table;
        width: 100%;
        max-width: 100%;
        overflow: visible;
        font-size: .905em;
      }

      .markdown-body thead { display: table-header-group; }
      .markdown-body tr { break-inside: avoid; page-break-inside: avoid; }

      .markdown-body pre {
        white-space: pre-wrap !important;
        overflow-wrap: anywhere;
      }
    }
  </style>

            <option value="9">9 pt</option>
            <option value="9.5">9.5 pt</option>
            <option value="10">10 pt</option>
            <option value="10.5">10.5 pt</option>
            <option value="11">11 pt</option>
            <option value="12">12 pt</option>
          </select>
        </div>
        <div class="type-control">
          <label id="weightLabel" for="weightSelect">Weight</label>
          <select id="weightSelect" title="本文の太さ / Document weight">
            <option value="400">Regular</option>
            <option value="500">Medium</option>
            <option value="600">Semi-bold</option>
          </select>
        </div>
      </div>
      <button id="printBtn" type="button" disabled>印刷</button>
      <button id="themeBtn" type="button" title="表示テーマを切り替え">☼</button>
      <button id="langBtn" type="button" title="Switch language">EN</button>
      <input id="fileInput" type="file" accept=".md,.markdown,.mdown,.mkd,text/markdown,text/plain">
      <input id="folderInput" type="file" webkitdirectory directory multiple>
    </header>

    <div class="statusbar">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">Markdownファイルを開くか、この画面にドロップしてください。</span>
      <span class="status-spacer"></span>
      <span class="compat" id="folderStatus">Folder: —</span>
      <span class="compat">CommonMark / GFM + Task Lists + Footnotes</span>
    </div>

    <main class="workspace" id="workspace">
      <article class="paper" id="paper">
        <div class="empty-state" id="emptyState">
          <div class="empty-inner">
            <div class="empty-icon">.md</div>
            <h1>Markdownを文書として表示・印刷</h1>
            <p>Markdownファイルをドラッグ＆ドロップするか、上の「Markdownを開く」から選択してください。</p>
          </div>
        </div>
        <div class="markdown-body" id="rendered" hidden></div>
      </article>
    </main>
  </div>

  <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
    <div class="drop-card"><strong>.md</strong> ファイルをここにドロップ</div>
  </div>

  <script>
    (() => {
      'use strict';

      const i18n = {
        ja: {
          noFile: 'ファイル未選択 / No file selected',
          open: 'Markdownを開く',
          openFolder: 'フォルダを開く',
          print: '印刷',
          idle: 'Markdownファイルを開くか、この画面にドロップしてください。',
          loaded: 'レンダリング完了',
          loadedImages: (ok, total) => `レンダリング完了 · ローカル画像 ${ok}/${total}`,
          loading: '読み込み中…',
          folderLoading: 'フォルダを読み込み中…',
          folderReady: name => `フォルダ「${name}」を読み込みました。`,
          folderReadyImages: (name, ok, total) => `フォルダ「${name}」を読み込みました · ローカル画像 ${ok}/${total}`,
          folderFallback: name => `フォルダ「${name}」を読み込みました。MDの位置を特定できないため、フォルダ直下を基準に画像を解決します。`,
          folderCancelled: 'フォルダ選択をキャンセルしました。',
          folderUnsupported: 'このブラウザではフォルダ選択を利用できません。Chrome / Edge 系ブラウザを使用してください。',
          autoOpened: name => `フォルダ直下にある唯一のMarkdown「${name}」を自動で開きました。`,
          rootMdNone: 'フォルダを読み込みました。ルート直下にMarkdownはありません。',
          rootMdMany: count => `フォルダを読み込みました。ルート直下にMarkdownが${count}個あるため、自動では開きません。`,
          libError: 'Markdownレンダリングライブラリを読み込めませんでした。通常版ではネット接続を、オフライン版ではビルド状態を確認してください。',
          invalid: 'Markdownファイルを選択してください。',
          readError: 'ファイルを読み込めませんでした。',
          drop: '.md ファイルをここにドロップ',
          emptyTitle: 'Markdownを文書として表示・印刷',
          emptyText: 'Markdownファイルをドラッグ＆ドロップするか、上の「Markdownを開く」から選択してください。画像が相対パスの場合は「フォルダを開く」を追加で実行してください。',
          folderLabel: name => `Folder: ${name || '—'}`,
          fontLabel: 'フォント',
          sizeLabel: 'サイズ',
          weightLabel: '太さ',
          standardFont: '標準',
          regularWeight: '標準',
          mediumWeight: '中',
          semiboldWeight: '太め'
        },
        en: {
          noFile: 'No file selected',
          open: 'Open Markdown',
          openFolder: 'Open Folder',
          print: 'Print',
          idle: 'Open a Markdown file or drop it anywhere on this window.',
          loaded: 'Rendered',
          loadedImages: (ok, total) => `Rendered · local images ${ok}/${total}`,
          loading: 'Loading…',
          folderLoading: 'Loading folder…',
          folderReady: name => `Folder “${name}” loaded.`,
          folderReadyImages: (name, ok, total) => `Folder “${name}” loaded · local images ${ok}/${total}`,
          folderFallback: name => `Folder “${name}” loaded. The Markdown location could not be identified, so the folder root is being used as the image base.`,
          folderCancelled: 'Folder selection cancelled.',
          folderUnsupported: 'Folder selection is not supported in this browser. Use a Chromium-based browser such as Chrome or Edge.',
          autoOpened: name => `Automatically opened the only Markdown file at the folder root: “${name}”.`,
          rootMdNone: 'Folder loaded. No Markdown file exists at the folder root.',
          rootMdMany: count => `Folder loaded. ${count} Markdown files exist at the folder root, so none was opened automatically.`,
          libError: 'The Markdown rendering libraries are unavailable. Check the network connection for the standard edition or the build state for the offline edition.',
          invalid: 'Please select a Markdown file.',
          readError: 'The file could not be read.',
          drop: 'Drop a .md file here',
          emptyTitle: 'View and print Markdown as a document',
          emptyText: 'Drag and drop a Markdown file, or choose one with “Open Markdown”. If images use relative paths, also choose “Open Folder”.',
          folderLabel: name => `Folder: ${name || '—'}`,
          fontLabel: 'Font',
          sizeLabel: 'Size',
          weightLabel: 'Weight',
          standardFont: 'Standard',
          regularWeight: 'Regular',
          mediumWeight: 'Medium',
          semiboldWeight: 'Semi-bold'
        }
      };

      let language = localStorage.getItem('mpv.lang') || 'ja';
      let currentFileName = '';
      let currentFile = null;
      let currentSource = '';
      let currentMarkdownPath = null; // Path relative to the selected folder root, e.g. docs/readme.md
      let hasDocument = false;
      let md = null;
      let dragDepth = 0;

      // Folder state is deliberately independent from the current Markdown state.
      let currentFolderName = '';
      let folderFiles = new Map(); // normalized path -> File, relative to selected folder root
      let folderRootPrefix = '';
      let objectUrls = [];

      const els = {
        openBtn: document.getElementById('openBtn'),
        folderBtn: document.getElementById('folderBtn'),
        printBtn: document.getElementById('printBtn'),
        themeBtn: document.getElementById('themeBtn'),
        langBtn: document.getElementById('langBtn'),
        fontLabel: document.getElementById('fontLabel'),
        sizeLabel: document.getElementById('sizeLabel'),
        weightLabel: document.getElementById('weightLabel'),
        fontSelect: document.getElementById('fontSelect'),
        sizeSelect: document.getElementById('sizeSelect'),
        weightSelect: document.getElementById('weightSelect'),
        fileInput: document.getElementById('fileInput'),
        folderInput: document.getElementById('folderInput'),
        fileName: document.getElementById('fileName'),
        folderStatus: document.getElementById('folderStatus'),
        statusDot: document.getElementById('statusDot'),
        statusText: document.getElementById('statusText'),
        workspace: document.getElementById('workspace'),
        rendered: document.getElementById('rendered'),
        emptyState: document.getElementById('emptyState'),
        dropOverlay: document.getElementById('dropOverlay')
      };

      function t(key, ...args) {
        const value = i18n[language][key];
        return typeof value === 'function' ? value(...args) : value;
      }

      function setStatus(text, state = '') {
        els.statusText.textContent = text;
        els.statusDot.className = 'status-dot' + (state ? ' ' + state : '');
      }

      function updateFolderLabel() {
        els.folderStatus.textContent = t('folderLabel', currentFolderName);
        els.folderStatus.title = currentFolderName || '';
      }

      function applyLanguage() {
        document.documentElement.lang = language;
        els.openBtn.textContent = t('open');
        els.folderBtn.textContent = t('openFolder');
        els.printBtn.textContent = t('print');
        els.langBtn.textContent = language === 'ja' ? 'EN' : '日本語';
        els.fontLabel.textContent = t('fontLabel');
        els.sizeLabel.textContent = t('sizeLabel');
        els.weightLabel.textContent = t('weightLabel');
        els.fontSelect.options[0].textContent = t('standardFont');
        els.weightSelect.options[0].textContent = t('regularWeight');
        els.weightSelect.options[1].textContent = t('mediumWeight');
        els.weightSelect.options[2].textContent = t('semiboldWeight');
        els.fileName.textContent = currentFileName || t('noFile');
        updateFolderLabel();
        if (!hasDocument) setStatus(t('idle'));
        const drop = els.dropOverlay.querySelector('.drop-card');
        drop.innerHTML = language === 'ja' ? '<strong>.md</strong> ファイルをここにドロップ' : '<strong>.md</strong> ' + t('drop').replace('.md ', '');
        const h = els.emptyState.querySelector('h1');
        const p = els.emptyState.querySelector('p');
        h.textContent = t('emptyTitle');
        p.textContent = t('emptyText');
      }

      function initTheme() {
        const saved = localStorage.getItem('mpv.theme') || 'dark';
        document.documentElement.dataset.theme = saved;
        els.themeBtn.textContent = saved === 'dark' ? '☼' : '☾';
      }

      function toggleTheme() {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('mpv.theme', next);
        els.themeBtn.textContent = next === 'dark' ? '☼' : '☾';
      }

      const fontStacks = {
        standard: '-apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif',
        meiryo: 'Meiryo, "Yu Gothic", "Segoe UI", sans-serif',
        yugothic: '"Yu Gothic", "YuGothic", Meiryo, "Segoe UI", sans-serif',
        bizudpgothic: '"BIZ UDPGothic", "BIZ UDGothic", Meiryo, "Yu Gothic", sans-serif',
        yumincho: '"Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "BIZ UDPMincho", serif',
        bizudpmincho: '"BIZ UDPMincho", "BIZ UDMincho", "Yu Mincho", "YuMincho", serif'
      };
      const allowedSizes = new Set(['9', '9.5', '10', '10.5', '11', '12']);
      const allowedWeights = new Set(['400', '500', '600']);

      function applyTypography(save = true) {
        const fontKey = fontStacks[els.fontSelect.value] ? els.fontSelect.value : 'standard';
        const size = allowedSizes.has(els.sizeSelect.value) ? els.sizeSelect.value : '10.5';
        const weight = allowedWeights.has(els.weightSelect.value) ? els.weightSelect.value : '400';

        document.documentElement.style.setProperty('--doc-font', fontStacks[fontKey]);
        document.documentElement.style.setProperty('--doc-size', `${size}pt`);
        document.documentElement.style.setProperty('--doc-weight', weight);

        if (save) {
          localStorage.setItem('mpv.font', fontKey);
          localStorage.setItem('mpv.size', size);
          localStorage.setItem('mpv.weight', weight);
        }
      }

      function initTypography() {
        const fontKey = localStorage.getItem('mpv.font') || 'standard';
        const size = localStorage.getItem('mpv.size') || '10.5';
        const weight = localStorage.getItem('mpv.weight') || '400';

        els.fontSelect.value = fontStacks[fontKey] ? fontKey : 'standard';
        els.sizeSelect.value = allowedSizes.has(size) ? size : '10.5';
        els.weightSelect.value = allowedWeights.has(weight) ? weight : '400';
        applyTypography(false);
      }

      function initMarkdown() {
        if (typeof window.markdownit !== 'function' || typeof window.DOMPurify === 'undefined') {
          setStatus(t('libError'), 'error');
          els.openBtn.disabled = true;
          els.folderBtn.disabled = true;
          return false;
        }

        md = window.markdownit({
          html: true,
          xhtmlOut: false,
          breaks: false,
          langPrefix: 'language-',
          linkify: true,
          typographer: false,
          quotes: '“”‘’'
        });

        if (typeof window.markdownitTaskLists === 'function') {
          md.use(window.markdownitTaskLists, { enabled: true, label: true, labelAfter: true });
        }
        if (typeof window.markdownitFootnote === 'function') {
          md.use(window.markdownitFootnote);
        }

        const defaultLinkOpen = md.renderer.rules.link_open || ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options));
        md.renderer.rules.link_open = (tokens, idx, options, env, self) => {
          const hrefIndex = tokens[idx].attrIndex('href');
          if (hrefIndex >= 0) {
            const href = tokens[idx].attrs[hrefIndex][1] || '';
            if (!href.startsWith('#')) {
              tokens[idx].attrSet('target', '_blank');
              tokens[idx].attrSet('rel', 'noopener noreferrer');
            }
          }
          return defaultLinkOpen(tokens, idx, options, env, self);
        };

        return true;
      }

      function sanitize(html) {
        return window.DOMPurify.sanitize(html, {
          USE_PROFILES: { html: true },
          ADD_TAGS: ['details', 'summary', 'kbd'],
          ADD_ATTR: ['target', 'rel', 'open', 'checked', 'disabled', 'type', 'class', 'id', 'aria-label', 'src', 'alt', 'title']
        });
      }

      function revokeObjectUrls() {
        objectUrls.forEach(url => URL.revokeObjectURL(url));
        objectUrls = [];
      }

      function normalizePath(path) {
        const parts = String(path || '').replace(/\\/g, '/').split('/');
        const out = [];
        for (let part of parts) {
          if (!part || part === '.') continue;
          try { part = decodeURIComponent(part); } catch (_) {}
          if (part === '..') {
            if (!out.length) return null; // would escape the selected folder root
            out.pop();
          } else {
            out.push(part);
          }
        }
        return out.join('/');
      }

      function dirname(path) {
        const normalized = normalizePath(path || '');
        if (!normalized || !normalized.includes('/')) return '';
        return normalized.slice(0, normalized.lastIndexOf('/'));
      }

      function joinRelative(baseDir, ref) {
        const cleanRef = String(ref || '').split('#')[0].split('?')[0];
        if (!cleanRef) return null;
        return normalizePath(baseDir ? `${baseDir}/${cleanRef}` : cleanRef);
      }

      function isLocalRelativeUrl(src) {
        const value = String(src || '').trim();
        if (!value || value.startsWith('#') || value.startsWith('//')) return false;
        if (/^(?:[a-z][a-z0-9+.-]*:)/i.test(value)) return false; // http:, https:, data:, blob:, file:, etc.
        if (/^[a-zA-Z]:[\\/]/.test(value)) return false; // Windows absolute path
        if (value.startsWith('/') || value.startsWith('\\')) return false;
        return true;
      }

      async function resolveLocalImages() {
        revokeObjectUrls();
        if (!folderFiles.size) return { total: 0, resolved: 0 };

        const baseDir = dirname(currentMarkdownPath || '');
        const images = [...els.rendered.querySelectorAll('img[src]')].filter(img => isLocalRelativeUrl(img.getAttribute('src')));
        let resolved = 0;

        for (const img of images) {
          const original = img.getAttribute('src') || '';
          const targetPath = joinRelative(baseDir, original);
          const file = targetPath ? folderFiles.get(targetPath) : null;
          img.dataset.originalSrc = original;
          if (file) {
            const url = URL.createObjectURL(file);
            objectUrls.push(url);
            img.src = url;
            img.classList.remove('local-image-missing');
            resolved += 1;
          } else {
            img.classList.add('local-image-missing');
            img.title = img.title || `Local image not found: ${original}`;
          }
        }

        return { total: images.length, resolved };
      }

      function postProcess() {
        els.rendered.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.disabled = true;
        });

        els.rendered.querySelectorAll('a').forEach(a => {
          const href = a.getAttribute('href') || '';
          if (!href.startsWith('#') && !/^(https?:|mailto:|tel:)/i.test(href)) {
            a.addEventListener('click', e => e.preventDefault());
          }
        });

        els.rendered.querySelectorAll('table').forEach(table => {
          if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
          const wrap = document.createElement('div');
          wrap.className = 'table-wrap';
          table.parentNode.insertBefore(wrap, table);
          wrap.appendChild(table);
        });
      }

      async function renderMarkdown(source, fileName, statusOverride = null) {
        if (!md && !initMarkdown()) return;

        try {
          const cleanSource = source.replace(/^\uFEFF/, '');
          const html = md.render(cleanSource);
          els.rendered.innerHTML = sanitize(html);
          postProcess();

          currentFileName = fileName;
          currentSource = cleanSource;
          hasDocument = true;
          els.fileName.textContent = fileName;
          document.title = `${fileName} — Markdown Print Viewer`;
          els.emptyState.hidden = true;
          els.rendered.hidden = false;
          els.printBtn.disabled = false;

          const imageResult = await resolveLocalImages();
          if (statusOverride) {
            setStatus(statusOverride, 'ok');
          } else if (imageResult.total > 0) {
            setStatus(t('loadedImages', imageResult.resolved, imageResult.total), imageResult.resolved === imageResult.total ? 'ok' : 'error');
          } else {
            setStatus(t('loaded'), 'ok');
          }
          els.workspace.scrollTop = 0;
          els.workspace.scrollLeft = 0;
          window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
          return imageResult;
        } catch (err) {
          console.error(err);
          els.rendered.innerHTML = `<div class="load-error">${escapeHtml(t('readError'))}</div>`;
          els.emptyState.hidden = true;
          els.rendered.hidden = false;
          setStatus(t('readError'), 'error');
        }
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>\"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));
      }

      function looksLikeMarkdown(file) {
        return !!file && (/\.(md|markdown|mdown|mkd)$/i.test(file.name) || file.type === 'text/markdown' || file.type === 'text/plain' || !file.type);
      }

      function fileFingerprint(file) {
        return file ? `${file.name}\n${file.size}\n${file.lastModified}` : '';
      }

      async function identifyMarkdownPathInFolder(file) {
        if (!file || !folderFiles.size) return null;

        // Fast path: exact metadata match, usually sufficient for a dropped File.
        const fp = fileFingerprint(file);
        let candidates = [...folderFiles.entries()].filter(([, candidate]) => fileFingerprint(candidate) === fp);
        if (candidates.length === 1) return candidates[0][0];

        // Narrow by filename, then compare actual Markdown text if needed.
        candidates = [...folderFiles.entries()].filter(([, candidate]) => candidate.name.toLowerCase() === file.name.toLowerCase());
        if (candidates.length === 1) return candidates[0][0];
        if (candidates.length > 1 && currentSource) {
          for (const [path, candidate] of candidates) {
            try {
              const text = (await candidate.text()).replace(/^\uFEFF/, '');
              if (text === currentSource) return path;
            } catch (_) {}
          }
        }
        return null;
      }

      async function openFile(file, knownPath = null, statusOverride = null) {
        if (!file) return;
        if (!looksLikeMarkdown(file)) {
          setStatus(t('invalid'), 'error');
          return;
        }

        setStatus(t('loading'));
        try {
          const text = await file.text();
          currentFile = file;
          currentMarkdownPath = knownPath ? normalizePath(knownPath) : null;

          if (!currentMarkdownPath && folderFiles.size) {
            currentSource = text.replace(/^\uFEFF/, '');
            currentMarkdownPath = await identifyMarkdownPathInFolder(file);
            if (!currentMarkdownPath) currentMarkdownPath = file.name; // selected folder root as explicit fallback base
          }

          await renderMarkdown(text, file.name, statusOverride);
        } catch (err) {
          console.error(err);
          setStatus(t('readError'), 'error');
        }
      }

      function relativePathWithoutRoot(file) {
        const raw = String(file.webkitRelativePath || '').replace(/\\/g, '/');
        if (!raw) return file.name;
        const parts = raw.split('/').filter(Boolean);
        if (parts.length > 1) parts.shift(); // strip selected root folder name
        return normalizePath(parts.join('/')) || file.name;
      }

      async function loadFolderFileList(files) {
        const list = [...files];
        if (!list.length) return false;

        folderFiles = new Map();
        const rawFirst = String(list[0].webkitRelativePath || '').replace(/\\/g, '/');
        folderRootPrefix = rawFirst.includes('/') ? rawFirst.split('/')[0] : '';
        currentFolderName = folderRootPrefix || currentFolderName || 'Selected Folder';

        for (const file of list) {
          const path = relativePathWithoutRoot(file);
          if (path) folderFiles.set(path, file);
        }
        updateFolderLabel();
        return true;
      }

      function rootMarkdownEntries() {
        return [...folderFiles.entries()].filter(([path, file]) => !path.includes('/') && /\.(md|markdown|mdown|mkd)$/i.test(file.name));
      }

      async function handleFolderSelection(files) {
        setStatus(t('folderLoading'));
        const loaded = await loadFolderFileList(files);
        if (!loaded) {
          setStatus(t('folderCancelled'));
          return;
        }

        if (!hasDocument) {
          const rootMd = rootMarkdownEntries();
          if (rootMd.length === 1) {
            const [path, file] = rootMd[0];
            await openFile(file, path, t('autoOpened', file.name));
          } else if (rootMd.length === 0) {
            setStatus(t('rootMdNone'), 'ok');
          } else {
            setStatus(t('rootMdMany', rootMd.length), 'ok');
          }
          return;
        }

        // Existing Markdown is intentionally preserved. Only establish/refresh its base path and images.
        const matchedPath = await identifyMarkdownPathInFolder(currentFile);
        const exact = !!matchedPath;
        currentMarkdownPath = matchedPath || currentFileName; // root fallback if the Markdown itself is outside/not identifiable
        const imageResult = await renderMarkdown(currentSource, currentFileName);

        if (imageResult && imageResult.total > 0) {
          setStatus(t('folderReadyImages', currentFolderName, imageResult.resolved, imageResult.total), imageResult.resolved === imageResult.total ? 'ok' : 'error');
        } else {
          setStatus(exact ? t('folderReady', currentFolderName) : t('folderFallback', currentFolderName), exact ? 'ok' : 'error');
        }
      }

      els.openBtn.addEventListener('click', () => els.fileInput.click());
      els.fileInput.addEventListener('change', async () => {
        const file = els.fileInput.files && els.fileInput.files[0];
        await openFile(file);
        els.fileInput.value = '';
      });

      els.folderBtn.addEventListener('click', () => {
        if (!('webkitdirectory' in els.folderInput)) {
          setStatus(t('folderUnsupported'), 'error');
          return;
        }
        els.folderInput.click();
      });
      els.folderInput.addEventListener('change', async () => {
        const files = els.folderInput.files;
        await handleFolderSelection(files || []);
        // Reset so the same folder can be deliberately selected again later.
        els.folderInput.value = '';
      });

      els.printBtn.addEventListener('click', () => {
        if (hasDocument) window.print();
      });
      els.themeBtn.addEventListener('click', toggleTheme);
      els.fontSelect.addEventListener('change', () => applyTypography(true));
      els.sizeSelect.addEventListener('change', () => applyTypography(true));
      els.weightSelect.addEventListener('change', () => applyTypography(true));
      els.langBtn.addEventListener('click', () => {
        language = language === 'ja' ? 'en' : 'ja';
        localStorage.setItem('mpv.lang', language);
        applyLanguage();
      });

      window.addEventListener('dragenter', e => {
        e.preventDefault();
        dragDepth += 1;
        els.dropOverlay.classList.add('active');
      });
      window.addEventListener('dragover', e => {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      });
      window.addEventListener('dragleave', e => {
        e.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) els.dropOverlay.classList.remove('active');
      });
      window.addEventListener('drop', async e => {
        e.preventDefault();
        dragDepth = 0;
        els.dropOverlay.classList.remove('active');
        const files = [...(e.dataTransfer?.files || [])];
        const markdownFile = files.find(f => /\.(md|markdown|mdown|mkd)$/i.test(f.name)) || files[0];
        await openFile(markdownFile);
      });

      // Keyboard: Ctrl/Cmd+O = open Markdown; Ctrl/Cmd+P remains browser-native print.
      window.addEventListener('keydown', e => {
        const mod = e.ctrlKey || e.metaKey;
        if (mod && e.key.toLowerCase() === 'o') {
          e.preventDefault();
          els.fileInput.click();
        }
      });

      window.addEventListener('beforeunload', revokeObjectUrls);

      initTheme();
      initTypography();
      applyLanguage();
      initMarkdown();
    })();
  </script>
</body>
</html>
